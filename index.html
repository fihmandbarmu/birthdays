<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Birthday Card Creator</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
</head>
<body>
    <div class="app-container">
        <!-- Controls Section -->
        <div class="controls-section">
            <h1>Card Creator ✨</h1>
            <p>Design a beautiful, modern birthday card.</p>
            
            <form id="cardForm">
                <div class="form-group">
                    <label for="recipientName">Who is celebrating?</label>
                    <input type="text" id="recipientName" placeholder="e.g. Sarah" required>
                </div>

                <div class="form-group">
                    <label for="templateSelect">Need inspiration?</label>
                    <select id="templateSelect"></select>
                </div>

                <div class="form-group">
                    <label for="birthdayMessage">Birthday Message</label>
                    <textarea id="birthdayMessage" rows="4" placeholder="Write your message here..." required></textarea>
                </div>

                <div class="form-group">
                    <label for="imageUpload">Upload a Photo</label>
                    <input type="file" id="imageUpload" accept="image/*">
                </div>

                <!-- Customization Features -->
                <div class="color-controls">
                    <div class="form-group">
                        <label for="cardBgColor">Card Color</label>
                        <input type="color" id="cardBgColor" value="#ffffff">
                    </div>
                    <div class="form-group">
                        <label for="accentColor">Accent Color</label>
                        <input type="color" id="accentColor" value="#ff6b6b">
                    </div>
                </div>

                <button type="button" id="generateBtn" class="primary-btn">Celebrate & Generate! 🎈</button>
            </form>

            <div id="actionButtons" class="action-buttons hidden">
                <button type="button" id="downloadBtn" class="secondary-btn">Download Card</button>
                <button type="button" id="emailBtn" class="secondary-btn">Share via Email</button>
            </div>
        </div>

        <!-- Preview Section -->
        <div class="preview-section">
            <div id="cardCaptureArea" class="card-wrapper">
                <div class="card-modern">
                    <div class="card-top-accent"></div>
                    <div class="card-image-wrapper">
                        <img id="previewImage" src="https://placehold.co/400x400/f0f0f0/cccccc?text=Photo" alt="Birthday Person">
                    </div>
                    <div class="card-content">
                        <h2>Happy Birthday, <br><span id="previewName">Name</span>!</h2>
                        <div class="divider"></div>
                        <p id="previewMessage">Your message will appear here...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts loaded in order -->
    <script src="messages.js"></script>
    <script src="script.js"></script>
</body>
</html>
